<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liliana Sanfilippo</title>

    <script>
        // Fange alle direkten Zugriffe ab und redirect zu Root mit Path als Query-Param
        (function() {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            // Wenn wir nicht auf root sind, redirect zu root mit vollem Path
            if (path !== '/' && !path.endsWith('.html') && !path.endsWith('.js') && !path.endsWith('.css')) {
                window.location.href = '/?_path=' + encodeURIComponent(path + search + hash);
            }
        })();
    </script>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
