<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <script>
        // GitHub Pages 404 Redirect für React Router
        // Encodes den Path und schickt ihn als Query-Param zu index.html
        var pathSegments = window.location.pathname
            .split('/')
            .slice(1)  // Entferne leeren String am Anfang
            .map(s => s || '/')
            .join('/');

        window.location.replace(
            '/index.html?p=' + encodeURIComponent('/' + pathSegments) +
            window.location.search.replace(/&/g, '~and~') +
            window.location.hash
        );
    </script>
</head>
<body>
</body>
</html>
