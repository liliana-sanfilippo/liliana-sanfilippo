<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <script>
        // Speichere den original Path
        sessionStorage.setItem('redirectPath', window.location.pathname + window.location.search + window.location.hash);
        // Redirect zu Root
        window.location = '/';
    </script>
</head>
<body></body>
</html>
